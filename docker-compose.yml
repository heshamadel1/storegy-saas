services:
  # ========== Workspace ==========
  workspace:
    build:
      context: .
      dockerfile: docker/development/workspace/Dockerfile
      args:
        UID: 1000
        GID: 1000
        NODE_VERSION: "22.0.0"
        XDEBUG_ENABLED: "true"
        XDEBUG_MODE: "debug"
        XDEBUG_HOST: "host.docker.internal"
        XDEBUG_IDE_KEY: "VSCODE"
        XDEBUG_LOG: "/var/www/xdebug.log"
        XDEBUG_LOG_LEVEL: "1"
    container_name: storegy_workspace
    working_dir: /var/www
    volumes:
      - ./src/backend:/var/www
    networks:
      - laravel_net
    depends_on:
      - app
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true

  # ========== Next.js Frontend ==========
  frontend:
    build:
      context: .
      dockerfile: docker/development/frontend/Dockerfile
    container_name: nextjs_frontend
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - laravel_net
    environment:
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --hostname 0.0.0.0

  # ========== PHP-FPM ==========
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src/backend:/var/www
    networks:
      - laravel_net
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ========== Nginx ==========
  webserver:
    image: nginx:1.30.5-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src/backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_net
    depends_on:
      - app

  # ========== PostgreSQL ==========
  db:
    image: postgres:18.6-alpine
    container_name: storegy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: storegy
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - laravel_net

  # ========== Redis ==========
  redis:
    image: redis:8.10-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel_net
    command: redis-server --appendonly yes

networks:
  laravel_net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
